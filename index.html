<!doctype html>
<html lang="en" data-theme="light">
<head>
<!-- site made by A.t -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sara Land — A Personal Book Archive</title>
<meta name="description" content="Sara Land — a cozy personal archive of the books I love.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7eddd">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://covers.openlibrary.org https://*.archive.org; connect-src 'self' https://openlibrary.org; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>

<!-- The photo: fixed full-screen background on phones, a side panel on desktop -->
<div class="bg" aria-hidden="true"></div>
<canvas id="leaves" aria-hidden="true"></canvas>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Toggle dark / light mode">
  <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<div class="content">
  <header class="hero">
    <p class="eyebrow">A personal book archive</p>
    <h1 class="title">Sara <span>Land</span></h1>
    <p class="tagline">Where autumn lingers between the pages.</p>
    <span class="hero-rule" aria-hidden="true"></span>
  </header>

  <div class="shelf">
    <main>
      <div class="toolbar">
        <label class="search" for="search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search my shelf…" autocomplete="off" spellcheck="false" maxlength="80">
        </label>
        <p class="count" id="count" aria-live="polite"></p>
      </div>

      <p class="status" id="status" role="status"></p>
      <ul class="grid" id="grid"></ul>
      <noscript><p class="status">Please enable JavaScript to see the books.</p></noscript>
    </main>

    <footer class="footer">
      <span class="footer-line" aria-hidden="true"></span>
      <span class="footer-name">SarayBook</span>
      <span class="footer-line" aria-hidden="true"></span>
    </footer>
  </div>
</div>

<dialog id="modal" aria-labelledby="mTitle">
  <div class="modal-inner">
    <button class="modal-close" id="mClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="modal-cover" id="mCover"></div>
    <div class="modal-body">
      <p class="m-year" id="mYear"></p>
      <h2 class="m-title" id="mTitle"></h2>
      <p class="m-author" id="mAuthor"></p>
      <div class="m-desc" id="mDesc"></div>
      <a class="m-link" id="mLink" href="#" target="_blank" rel="noopener noreferrer" hidden>View on Open Library ↗</a>
    </div>
  </div>
</dialog>

<script src="js/app.js"></script>
</body>
</html>
